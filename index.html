<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Souvik &amp; Chinar | Wedding Invitation</title>
  <meta name="description" content="The Wedding of Souvik Banerjee &amp; Chinar Sharma, 9 December 2026. Tap to open the invitation.">
  <meta property="og:title" content="Souvik &amp; Chinar | Wedding Invitation">
  <meta property="og:description" content="The Wedding Ceremony, 9 December 2026, ROYAL AMBIENCE PARTY LAWN 2, INDIRAPURAM, Ghaziabad. Tap to open the invitation.">
  <meta property="og:image" content="./assets/gate-cover.jpg?v=3">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Great+Vibes&family=Italianno&family=Noto+Serif+Devanagari:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Tenor+Sans&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/styles.css">
  <link rel="icon" type="image/svg+xml" href="./assets/ganesha-icon.svg">
</head>
<body class="locked">

  <!-- Stage 1: Gate / Share landing page -->
  <main class="xg" id="stage-gate"></main>

  <!-- Stage 2: Main Invitation Page -->
  <div class="page" id="stage-page" style="display: none;">
    <!-- Gold Dust Layer -->
    <div class="pw-dust" aria-hidden="true"></div>

    <!-- Traditional Indian Celebration Backdrop (Sage Mist, Hanging Garlands, Festive Motes) -->
    <div class="pw-sky" id="pw-sky-back" aria-hidden="true"></div>

    <!-- Traditional Floral Shower (Genda Phool, Orchids, Tulips, Jasmine & Sage) -->
    <div class="pw-petals" id="pw-petals" aria-hidden="true"></div>

    <!-- Content Container (max-width: 500px, mobile centered) -->
    <div class="page-inner">
      <div id="hero-and-scratch-container"></div>
      <div id="rest-sections" class="rest" style="display: none;"></div>
    </div>

    <!-- Floating Persistent Controls -->
    <div class="dn-cue is-hidden" id="scroll-cue" role="button" aria-label="Scroll down">
      <svg viewBox="0 0 24 32">
        <rect x="5" y="2" width="14" height="24" rx="7"/>
        <line x1="12" y1="7" x2="12" y2="12"/>
      </svg>
      <span>Scroll</span>
    </div>

    <!-- Floating Music Toggle Button -->
    <button class="mu-btn" id="music-btn" type="button" aria-label="Pause music" style="display: none;"></button>
  </div>

  <!-- Background Music Element -->
  <audio id="bg-music" src="./assets/bg-music.mp3" preload="auto" loop></audio>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
